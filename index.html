<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Simulator — Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="login-logo">🎓</div>
    <h1>NETWORK SIMULATOR</h1>
    <p class="login-sub">Crimping · Topology · Assessment</p>

    <div class="login-role-selector">
      <button class="role-btn active" id="roleStudent" data-role="student" type="button">
        <span class="role-icon">👨‍🎓</span>
        <span class="role-name">Student</span>
      </button>
      <button class="role-btn" id="roleAdmin" data-role="admin" type="button">
        <span class="role-icon">👨‍💼</span>
        <span class="role-name">Admin</span>
      </button>
    </div>

    <div class="login-form">
      <div class="login-input-group">
        <label id="loginNameLabel">Full Name</label>
        <input type="text" id="loginName" placeholder="Enter your full name" autocomplete="off">
      </div>
      <div class="login-input-group" id="loginIdGroup">
        <label id="loginIdLabel">Student ID</label>
        <input type="text" id="loginId" placeholder="Enter your ID number" autocomplete="off">
      </div>
      <div class="login-input-group" id="loginPasswordGroup" style="display:none;">
        <label>Admin Password</label>
        <input type="password" id="loginPassword" placeholder="Enter admin password" autocomplete="off">
      </div>
      <div class="login-error" id="loginError"></div>
      <button class="login-btn" id="loginBtn" type="button">SIGN IN</button>
    </div>

    <div class="login-hint" id="loginHint">
      Demo: Any name + ID works for student login.
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
